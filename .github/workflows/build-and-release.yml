name: Build and Release

on:
  pull_request:
    branches: [main, develop, "beta/**"]
  push:
    branches:
      - main
      - develop
      - "beta/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    env:
      VITE_SUPABASE_URL:     ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
      VITE_PORTKEY_API_KEY: ${{ secrets.VITE_PORTKEY_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run make
            artifact_name: Snippai-win32-x64
            extension: zip
          - os: ubuntu-latest
            command: npm run make
            artifact_name: Snippai-linux-x64
            extension: zip
          - os: ubuntu-latest
            command: npm run make:linux-arm64
            artifact_name: Snippai-linux-arm64
            extension: zip
          - os: macos-latest
            command: npm run make:mac
            artifact_name: Snippai-darwin-arm64
            extension: zip
          - os: macos-latest
            command: npm run make:mac-amd64
            artifact_name: Snippai-darwin-x64
            extension: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update

      - name: Build application
        run: ${{ matrix.command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: out/make/**/*.${{ matrix.extension }}
          retention-days: 90

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: Release v${{ steps.package-version.outputs.version }}
          draft: false
          prerelease: false
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
